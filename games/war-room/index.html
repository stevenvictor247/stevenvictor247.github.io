<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Games">
<link rel="manifest" href="/games/manifest.webmanifest">
<link rel="icon" href="/games/icons/favicon.png">
<link rel="apple-touch-icon" href="/games/icons/apple-touch-icon.png">
<style>[hidden]{display:none!important}.hbtn{white-space:nowrap}</style>
<meta name="ph-base" content="ph/33bbe714-">
<title>War Room</title>
<meta name="description" content="An NFL fantasy draft trivia game. Draft real seasons from wild props, solo or 1v1 against a friend.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* Same clean trivia-site look as Hand-Off: light grey page, white rounded cards, Inter. */
:root{
  --bg:#f2f4f7; --card:#ffffff; --line:#e3e6eb; --line2:#cfd4db; --soft:#f6f7f9;
  --ink:#151a21; --ink2:#384150; --mute:#687180;
  --brand:#1e3a8a; --brand-2:#2b4fb8; --brand-soft:#e8eefb;
  --good:#1d7a43; --good-soft:#e7f3ec;
  --bad:#d92d20; --bad-soft:#fdecea; --gold:#c98a00; --gold-soft:#fff5db;
  --p1:#1e3a8a; --p1-soft:#e8eefb; --p2:#b42318; --p2-soft:#fdecea;
  --r:14px; --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #2f7de1;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:680px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 48px}

.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.top .row{max-width:680px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px));height:58px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-weight:900;font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.mk{width:32px;height:32px;border-radius:9px;background:var(--brand);display:grid;place-items:center;flex:none}
.mk svg{width:20px;height:20px}
.top .sp{flex:1}
.hbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap;text-decoration:none}
.hbtn:hover{background:var(--soft)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card+.card,.hud+.card,.turn+.card{margin-top:14px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 18px 0}
.card-h h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
.card-h span{font-size:13px;color:var(--mute);font-weight:600}
.card-b{padding:14px 18px 18px}

.hud{display:flex;align-items:center;gap:8px;margin:18px 0 12px;flex-wrap:wrap}
.hud .mode{font-weight:800;font-size:15px;margin-right:auto}
.hud .mode small{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.stat{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.stat b{font-size:16px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.stat.p1{border-color:var(--p1);box-shadow:inset 0 0 0 1px var(--p1)}
.stat.p2{border-color:var(--p2);box-shadow:inset 0 0 0 1px var(--p2)}
.pips{display:flex;gap:4px}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.pips i.on{background:var(--ink)}
.pips i.x2{background:var(--gold)}
.pips i.now{outline:2px solid var(--ink);outline-offset:1px}

.turn{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 14px;font-weight:800;font-size:15px;color:#fff;margin-bottom:12px}
.turn.p1{background:var(--p1)}.turn.p2{background:var(--p2)}
.turn small{font-weight:600;opacity:.85;font-size:13px;margin-left:auto}

/* prop card */
.prop{padding:20px 18px 18px;text-align:center;position:relative}
.prop .rd{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.prop .icon{margin:12px auto 10px;width:76px;height:76px}
.prop h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.prop .sub{margin:8px auto 0;max-width:42ch;color:var(--ink2);font-size:15px}
.prop .x2{position:absolute;top:14px;right:14px;background:var(--gold-soft);color:var(--gold);font-weight:900;font-size:13px;border-radius:999px;padding:4px 10px;border:1px solid #f3d58a}
.fits{display:flex;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.fits span{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--ink2)}
.fits span.no{background:transparent;color:#a3aab5;text-decoration:line-through;border:1px dashed var(--line2)}
.ico{width:76px;height:76px;border-radius:20px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:900;font-size:28px}
.ico svg{width:46%;height:46%}

/* search */
.ask{padding:16px 18px 16px}
.inp{position:relative}
.inp input{width:100%;height:52px;border:2px solid var(--line2);border-radius:12px;padding:0 44px 0 44px;font-size:17px;font-weight:600;background:#fff;outline:none}
.inp input:focus{border-color:var(--ink)}
.inp .mag{position:absolute;left:14px;top:15px;width:22px;height:22px;color:var(--mute)}
.inp .clr{position:absolute;right:8px;top:8px;width:36px;height:36px;border:0;background:none;border-radius:8px;color:var(--mute);font-size:20px;line-height:1}
.sugg{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:360px;overflow-y:auto}
.sugg li{display:flex;align-items:center;gap:12px;padding:9px 12px;border-top:1px solid var(--line)}
.sugg li:first-child{border-top:0}
.sugg li.act{background:var(--soft)}
.sugg .nm{flex:1;min-width:0}
.sugg .nm b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg .nm small{color:var(--mute);font-size:13px;font-weight:500}
.sugg .go{flex:none;border:0;border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;background:var(--ink);color:#fff}
.sugg .go.used{background:var(--soft);color:var(--mute);cursor:default}
.sugg .none{padding:14px;color:var(--mute);font-size:14px}
.pend{display:flex;align-items:center;gap:12px}
.pend .nm{flex:1;min-width:0}.pend .nm b{display:block;font-size:17px;font-weight:800}.pend .nm small{color:var(--mute);font-size:13px}
.yq{margin:14px 0 10px;font-size:14px;font-weight:600;color:var(--ink2)}
.yrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.yr{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:8px 4px;display:grid;gap:1px;justify-items:center}
.yr b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}.yr small{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.02em}
.yr:hover{background:var(--soft);border-color:var(--ink)}
.yr.no{opacity:.4;text-decoration:line-through}
.slt{font-weight:900}
.say{min-height:22px;margin-top:10px;font-size:14px;font-weight:600;color:var(--ink2);display:flex;gap:8px;align-items:flex-start}
.say.bad{color:var(--bad)}
.say svg{flex:none;width:18px;height:18px;margin-top:1px}
.ask-f{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.tbtn{background:none;border:0;padding:4px 0;font-size:14px;font-weight:600;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.tbtn:hover{color:var(--ink)}
.ask-f .hint{font-size:13px;color:var(--mute)}

/* result of a pick */
.res{padding:18px}
.res .who{display:flex;gap:14px;align-items:center}
.res .who .nm{min-width:0}
.res .who b{display:block;font-size:20px;font-weight:900;letter-spacing:-.02em;line-height:1.15}
.res .who small{display:block;color:var(--mute);font-size:14px;font-weight:600;margin-top:2px}
.res .pts{margin-left:auto;text-align:right;flex:none}
.res .pts b{font-size:34px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.res .pts small{display:block;font-size:12px;color:var(--mute);font-weight:700}
.line{margin-top:12px;font-size:14px;color:var(--ink2);background:var(--soft);border-radius:10px;padding:10px 12px}
.line b{color:var(--ink)}
.bestc{margin-top:10px;font-size:14px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bestc .tag{font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--good-soft);color:var(--good)}
.bestc .tag.miss{background:var(--gold-soft);color:var(--gold)}

/* lineup */
.lu{list-style:none;margin:0;padding:0}
.lu li{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.lu li:first-child{border-top:0;padding-top:0}
.lu .sl{flex:none;width:46px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:900;letter-spacing:.02em;background:var(--soft);color:var(--ink2)}
.lu .sl.QB{background:#fde8e8;color:#9b1c1c}.lu .sl.RB{background:#e3f4ea;color:#14532d}.lu .sl.WR{background:#e7eefc;color:#1e3a8a}.lu .sl.TE{background:#fff1dc;color:#92400e}.lu .sl.FLEX{background:#efe9fb;color:#5b21b6}
.lu .nm{flex:1;min-width:0}
.lu .nm b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu .nm small{display:block;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu .open{color:#a3aab5;font-weight:600;font-size:14px}
.lu .pt{flex:none;font-weight:800;font-variant-numeric:tabular-nums}
.lu li.wait{opacity:.5}.lu li.wait .nm.open{font-style:italic}
.lu li.now{background:var(--brand-soft);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:10px}.lu li.now .nm.open{color:var(--brand);font-weight:800}
.lu .ef{flex:none;width:44px;text-align:right;font-weight:700;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;line-height:1.1}.lu .ef small{display:block;font-size:9.5px;color:var(--mute);letter-spacing:.06em}
.tot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--line2);margin-top:10px;padding-top:10px;font-weight:800}.tot span{font-size:15px}.tot b{font-size:24px;font-variant-numeric:tabular-nums}
.clk{font-variant-numeric:tabular-nums}
.top10{list-style:none;margin:0;padding:0}.top10 li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}.top10 li:first-child{border-top:0}
.top10 .rk{flex:none;width:22px;text-align:right;font-weight:800;color:var(--mute);font-variant-numeric:tabular-nums}.top10 .nm{flex:1;min-width:0}.top10 .nm b{font-size:14.5px}.top10 .nm small{display:block;color:var(--mute);font-size:12px}
.top10 .pt{flex:none;font-weight:800;font-variant-numeric:tabular-nums}.top10 li.me{background:var(--good-soft);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:10px}.top10 li.me .nm small{color:var(--good);font-weight:700}
.lu .pt.z{color:var(--mute)}
.lu .x2s{font-size:11px;color:var(--gold);font-weight:800;margin-left:4px}
.lus{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lus .card{margin-top:0!important}
.lus .card-h h2{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.p1{background:var(--p1)}.dot.p2{background:var(--p2)}

/* tiles */
.ph{background-size:800% 800%;background-repeat:no-repeat;background-color:#e9ecf0;width:100%;height:100%}
.ph.mono{display:grid;place-items:center;background:linear-gradient(140deg,var(--a),var(--b));color:#fff;font-weight:800;letter-spacing:.02em}
.ptile{flex:none;border-radius:12px;overflow:hidden;background:#e9ecf0;border:1px solid var(--line)}
.ptile.xl{width:72px;height:72px}.ptile.xl .mono{font-size:24px}
.ptile.md{width:40px;height:40px;border-radius:10px}.ptile.md .mono{font-size:14px}
.ptile.sm{width:30px;height:30px;border-radius:8px}.ptile.sm .mono{font-size:11px}
.badge{flex:none;border-radius:50%;display:grid;place-items:center;background:var(--bg1);color:var(--fg);box-shadow:inset 0 0 0 3px var(--bg2);font-weight:900;letter-spacing:-.01em}
.badge.xl{width:76px;height:76px;font-size:22px;box-shadow:inset 0 0 0 5px var(--bg2)}

.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 180px;min-height:52px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 14px;text-align:center}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn:not(.pri):hover{background:var(--soft)}
.btn small{font-weight:600;font-size:13px;opacity:.8}

/* home */
.hero{text-align:center;padding:30px 20px 24px}
.hero .mk{width:64px;height:64px;border-radius:18px;margin:0 auto 14px}
.hero .mk svg{width:40px;height:40px}
.hero h1{margin:0;font-size:40px;font-weight:900;letter-spacing:-.035em;line-height:1}
.hero p{margin:10px auto 22px;max-width:42ch;color:var(--ink2);font-size:16px}
.modes{display:grid;gap:10px}
.mode-b{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px}
.mode-b:hover{background:var(--soft)}
.mode-b .ico{width:46px;height:46px;border-radius:12px;font-size:16px}
.mode-b b{display:block;font-size:16px;font-weight:800}
.mode-b small{display:block;color:var(--mute);font-size:13.5px;font-weight:500}
.mode-b .chev{margin-left:auto;color:var(--mute);font-size:22px}
.mode-b.pri{border:2px solid var(--brand)}
.how{list-style:none;margin:0;padding:0}
.how li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.how li:first-child{border-top:0;padding-top:0}
.how .n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
.how .t{font-weight:600;font-size:15px}
.how .t small{display:block;font-weight:500;color:var(--mute);font-size:13.5px}
.rules{margin:0;padding:0 0 0 18px;color:var(--ink2);font-size:15px}
.rules li{margin:6px 0}
.rules b{color:var(--ink)}
.foot{font-size:12.5px;color:var(--mute);text-align:center;margin:18px auto 0;max-width:58ch}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:700;color:var(--ink2)}
.field input{height:48px;border:2px solid var(--line2);border-radius:12px;padding:0 14px;font-size:16px;font-weight:600;outline:none}
.field input:focus{border-color:var(--ink)}
.codebox{display:flex;gap:8px}
.codebox input{flex:1;min-width:0;height:46px;border:2px solid var(--line2);border-radius:12px;padding:0 12px;font-size:15px;font-weight:600;outline:none}
.codebox input:focus{border-color:var(--ink)}
.codebox button{flex:none;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:800;padding:0 16px}
.err{color:var(--bad);font-size:14px;font-weight:600;margin-top:8px}
.banner{background:var(--brand-soft);border:1px solid #c8d5f5;color:var(--brand);border-radius:14px;padding:14px 16px;margin-top:18px;font-weight:600;font-size:15px}
.banner b{color:var(--ink)}

/* end */
.over{text-align:center;padding:26px 20px 22px}
.over .k{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.over .big{font-size:72px;font-weight:900;letter-spacing:-.05em;line-height:1;margin:6px 0 0;font-variant-numeric:tabular-nums}
.over .bl{font-size:16px;font-weight:700;color:var(--ink2)}
.over .why{margin:12px auto 0;max-width:46ch;color:var(--ink2);font-size:15px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:10px}
.vs .s{font-size:44px;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.vs .s small{display:block;font-size:14px;letter-spacing:0;font-weight:700;color:var(--ink2);margin-top:6px}
.vs .s.w{color:var(--good)}
.vs .v{font-weight:800;color:var(--mute)}
.crown{display:inline-block;margin-top:12px;font-size:14px;font-weight:800;border-radius:999px;padding:5px 14px;background:var(--good-soft);color:var(--good)}
.rounds{list-style:none;margin:0;padding:0}
.rounds li{padding:12px 0;border-top:1px solid var(--line)}
.rounds li:first-child{border-top:0;padding-top:0}
.rounds .ph2{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:8px}
.rounds .ph2 .x{font-size:11px;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:1px 7px}
.rounds .pk{display:flex;align-items:center;gap:10px;padding:3px 0}
.rounds .pk .nm{flex:1;min-width:0;font-size:14px}
.rounds .pk .nm b{font-weight:700}
.rounds .pk .nm small{color:var(--mute)}
.rounds .pk .pt{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.rounds .pk .pt.w{color:var(--good)}
.rounds .bst{font-size:12.5px;color:var(--mute);margin-top:4px}
.share{font-size:14px;white-space:pre-wrap;word-break:break-all;text-align:left;background:var(--soft);border-radius:12px;padding:12px 14px;margin:14px 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink2)}

.ov{position:fixed;inset:0;background:rgba(15,20,28,.45);z-index:40;display:grid;place-items:center;padding:16px}
.sheet{background:#fff;border-radius:16px;max-width:540px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.sheet h2{margin:0 0 6px;font-size:22px;font-weight:900;letter-spacing:-.02em}
.sheet h3{margin:16px 0 4px;font-size:15px;font-weight:800}

.loading{display:grid;place-items:center;min-height:70vh;text-align:center}
.loading b{font-size:22px;font-weight:900}
.bar2{width:180px;height:4px;background:var(--line);border-radius:4px;margin:14px auto 0;overflow:hidden}
.bar2 i{display:block;height:100%;width:40%;background:var(--brand);border-radius:4px;animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:14px;border-radius:999px;padding:10px 18px;z-index:60}

@media (max-width:560px){
  .card-h{padding:14px 14px 0}.card-b{padding:12px 14px 16px}
  .ask{padding:14px}.prop{padding:18px 14px 16px}.res{padding:16px 14px}
  .prop h1{font-size:24px}
  .lus{grid-template-columns:1fr}
  .over .big{font-size:60px}
  .vs .s{font-size:36px}
  .hbtn .lg{display:none}
  .hud .mode{flex-basis:100%}
  .hud .stat{padding:5px 10px}
  .res .pts b{font-size:28px}
}

  <section class="card"><div class="card-h"><h2>How it works</h2></div><div class="card-b"><ul class="how">

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function namesSheet(n,cb){
  const ov=$('#ov');const def=[store.get('name',''),store.get('name2','')];
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="nh"><h2 id="nh">${n===2?'Who\'s playing?':'Your name'}</h2><p style="color:var(--ink2);margin:0 0 14px">${n===2?'Player 1 picks first in round 1, then the order flips every round (snake draft). Once a player is taken, he\'s gone.':'Your friend will see this name on the challenge.'}</p>
   ${[...Array(n)].map((_,k)=>`<div class="field"><label for="nm${k}">Player ${k+1}</label><input id="nm${k}" maxlength="16" value="${esc(def[k])}" placeholder="${k?'Friend':'You'}"></div>`).join('')}
   <div class="btns"><button class="btn" id="nCancel">Cancel</button><button class="btn pri" id="nGo">Start draft</button></div></div>`;
  ov.hidden=false;$('#nm0').focus();
  const go=()=>{const names=[...Array(n)].map((_,k)=>($('#nm'+k).value.trim()||(k?'Player 2':(n===2?'Player 1':'You'))).slice(0,16));
    if(n===2&&names[0].toLowerCase()===names[1].toLowerCase()){names[1]+=' 2'}
    store.set('name',names[0]);if(n===2)store.set('name2',names[1]);ov.hidden=true;cb(names)};
  $('#nGo').onclick=go;$('#nCancel').onclick=()=>ov.hidden=true;
  ov.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')go()}));
}
function openCode(str){
  let o;try{o=readCode(str)}catch(e){const er=$('#codeErr');if(er){er.textContent=e.message;er.hidden=false}else home(esc(e.message));return}
  if(o.b&&o.b!==D.built){/* data changed since the code was made: stored points are shown as sent */}
  if(o.c){ // finished head-to-head: view only
    G={v:4,mode:'ch',seed:o.s,prime:genProps(o.s).prime,round:ROUNDS,turn:0,names:[o.c.n],lu:[Array(SLOTS.length).fill(null)],picks:[o.c.p.map((x,r)=>x[0]<0?{r,i:null,p:(x[2]||0)/10,k:-1,brick:x[2]<0?1:0}:{r,i:x[0],y:x[1],p:x[2]/10,k:-1})],wrong:[o.c.w||0],done:true,ch:{a:o.a,view:true},view:'end'};
    // rebuild lineup slots for display
    G.picks[0].forEach((p,pi)=>{if(p.i!=null){G.lu[0][p.r]=pi;p.k=p.r}});
    end();return;
  }
  const a=o.a;const tot=remoteTotal(a);
  const ov=$('#ov');
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ch"><h2 id="ch">${esc(a.n)} challenged you</h2><p style="color:var(--ink2);margin:0 0 14px">${esc(a.n)} scored <b>${tot.toFixed(1)}</b> points. You get the same 7 props in the same order. Their picks stay hidden until you finish.</p>
   <div class="field"><label for="nm0">Your name</label><input id="nm0" maxlength="16" value="${esc(store.get('name',''))}" placeholder="You"></div>
   <div class="btns"><button class="btn" id="nCancel">Not now</button><button class="btn pri" id="nGo">Accept</button></div></div>`;
  ov.hidden=false;
  $('#nGo').onclick=()=>{let n=($('#nm0').value.trim()||'You').slice(0,16);if(n.toLowerCase()===a.n.toLowerCase())n+=' 2';store.set('name',n);ov.hidden=true;newGame('ch',{seed:o.s,names:[n],ch:{a}})};
  $('#nCancel').onclick=()=>ov.hidden=true;
}

function rulesSheet(){
  const ov=$('#ov');
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rh"><h2 id="rh">How to play</h2>
  <ul class="rules">
   <li>Each of the <b>7 rounds</b> shows a prop and fills one spot, in order: <b>QB, RB, RB, WR, WR, TE, FLEX</b> (RB, WR or TE).</li>
   <li>Draft a real player for that spot who fits the prop, then <b>pick his season</b>. The season has to fit too (for team props he must have played for that team that year), and that season's points are your score. Traded mid-season? The whole season counts.</li>
   <li>Every prop has at least 6 good answers for its spot, so there's always a pick. Seasons count from 1970 to ${LAST}.</li>
   <li>One round per game is a <b>2× round</b>. It's marked on the round dots and the prop card.</li>
   <li><b>Wrong guess: −${WRONG}.</b> A player or season that doesn't fit the prop costs ${WRONG} points off your final score. You see why, and you can try again.</li>
   <li><b>Brick: −${BRICK}.</b> Stuck? Brick the round to move on. It scores −${BRICK}.</li>
   <li><b>Unique picks:</b> once a player is drafted, he and all his seasons are gone for the rest of the game.</li>
   <li><b>EFF:</b> your pick's points as a share of the best possible answer for that spot. After each round you see the top 10 answers.</li>
   <li>After each pick you see the <b>best available</b> player and season for that spot.</li>
  </ul>
  <h3>Scoring (PPR)</h3>
  <ul class="rules"><li>1 per catch, 1 per 10 rushing or receiving yards, 6 per rushing or receiving TD</li><li>1 per 25 passing yards, 4 per passing TD, −2 per interception</li><li>Fumbles and 2-point conversions aren't counted.</li></ul>
  <h3>1v1</h3>
  <ul class="rules"><li><b>On this phone:</b> snake draft. Both players answer the same prop each round, the first pick flips every round, and a player can only be on one team.</li>
   <li><b>Challenge a friend:</b> play your draft, then send the link. Your friend gets the same props in the same order without seeing your picks, then can send the result back.</li></ul>
  <div class="btns" style="margin-top:16px"><button class="btn pri" id="rClose">Got it</button></div></div>`;
  ov.hidden=false;$('#rClose').onclick=()=>ov.hidden=true;$('#rClose').focus();
}
